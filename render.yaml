services:
  - type: web
    name: cheonan-quiz-show
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --omit=dev && node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /health
    disk:
      name: quiz-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.3
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false

