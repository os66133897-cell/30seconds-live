<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30초의 기억 LIVE</title><style>*{box-sizing:border-box}body{background:#101b32;color:white;font:17px system-ui;margin:auto;max-width:850px;padding:20px}h1,#clock{color:#ffd477}section{background:#1e2d48;padding:20px;border-radius:16px;margin:15px 0}input,select,button{font:inherit;padding:12px;border-radius:8px;margin:5px 0}input,select{width:100%}button{background:#ffd477;color:#172033;font-weight:bold;border:0;cursor:pointer}button:disabled{opacity:.4}#clock{font-size:80px;font-weight:bold}#game{text-align:center}td,th{padding:8px;text-align:left}table{width:100%}[hidden]{display:none!important}</style><header>2026 천안시청소년재단 · 직원소통마당</header><h1>30초의 기억 LIVE</h1><p>우리 재단 사람을 찾아라!</p><section id="join"><form id="joinform"><select id="facility" required><option value="">소속 선택</option></select><input id="name" placeholder="이름 (동명이인은 A/B 포함)" required><button>참가 등록</button></form></section><section id="game" hidden><p id="round"></p><h2 id="question"></h2><div id="clock"></div><h3 id="score"></h3><form id="answerform"><input id="answer" autocomplete="off" placeholder="정답 입력"><button id="submit">정답 확인</button></form></section><section id="admin" hidden><input id="password" type="password" placeholder="관리자 비밀번호"><button id="login">접속</button><p>V4에서 내보낸 설정 JSON 파일을 선택하세요.</p><input id="file" type="file" accept=".json"><button id="import">설정 불러오기 (참가자 초기화)</button><h2 id="status"></h2><p id="preview"></p><button data-act="adminStart">전체 타이머 시작</button> <button data-act="adminStop">전체 종료</button> <button data-act="adminNext">다음 라운드</button> <button data-act="adminReset">게임 초기화</button><p><button id="csv">결과 CSV 다운로드</button></p><table><thead><tr><th>순위</th><th>이름</th><th>소속</th><th>점수</th></tr></thead><tbody id="ranking"></tbody></table></section><p id="msg" role="status"></p><script>
const $=id=>document.getElementById(id), admin=location.pathname==='/admin';let token=sessionStorage.getItem('liveToken'),current={},ranking=[],busy=false;const F=['사무국','천안시청소년수련관','태조산청소년수련관','청소년복합커뮤니티센터','성정청소년문화의집','청소년상담복지센터','학교밖청소년지원센터'];F.forEach(f=>$('facility').add(new Option(f,f)));$('admin').hidden=!admin;$('join').hidden=admin||!!token;$('game').hidden=admin||!token;async function api(a,x={}){let r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:$('password').value,...x})});let d=await r.json();if(d.error)throw Error(d.error);return d}function render(d){current=d;if(admin){$('status').textContent=`${d.round}/${d.total} 라운드 · ${d.count}명 · ${d.phase} · ${Math.ceil(d.remaining)}초`;$('preview').textContent=d.nextQuestion;ranking=d.ranking||[];$('ranking').replaceChildren();ranking.forEach((p,i)=>{let tr=document.createElement('tr');[i+1,p.name,p.facility,p.score].forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.append(td)});$('ranking').append(tr)});return}$('round').textContent=`ROUND ${d.round} / ${d.total}`;$('question').textContent=d.phase==='wait'?'관리자의 시작을 기다려 주세요':d.phase==='done'?'게임 종료!':d.question;$('clock').textContent=d.phase==='run'?Math.ceil(d.remaining):d.phase==='ended'?'종료':'';$('score').textContent=`누적 ${d.score}점`;$('answer').disabled=$('submit').disabled=d.phase!=='run';}async function poll(){if(busy||(!admin&&!token)||(admin&&!$('password').value))return;try{render(await api(admin?'adminState':'state'))}catch(e){$('msg').textContent=e.message;if(!admin&&e.message.includes('참가 등록')){token=null;sessionStorage.removeItem('liveToken');$('join').hidden=false;$('game').hidden=true}}}async function act(a,x={}){busy=true;try{let d=await api(a,x);if(d.token){token=d.token;sessionStorage.setItem('liveToken',token);$('join').hidden=true;$('game').hidden=false}render(d);$('msg').textContent=d.message||'완료';return true}catch(e){$('msg').textContent=e.message;return false}finally{busy=false}}$('joinform').onsubmit=e=>{e.preventDefault();act('join',{name:$('name').value,facility:$('facility').value})};$('answerform').onsubmit=async e=>{e.preventDefault();if(busy)return;if(await act('answer',{answer:$('answer').value,round:current.round}))$('answer').value='';$('answer').focus()};$('login').onclick=poll;$('import').onclick=async()=>{try{if(!confirm('설정을 불러오면 기존 참가자와 점수가 초기화됩니다.'))return;await act('adminImport',{settings:JSON.parse(await $('file').files[0].text())})}catch(e){$('msg').textContent='JSON 파일을 확인하세요.'}};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{if(b.dataset.act==='adminReset'&&!confirm('모든 참가자와 점수를 초기화할까요?'))return;act(b.dataset.act)});$('csv').onclick=()=>{let esc=v=>'"'+String(v).replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"';let csv='\ufeff순위,이름,소속,점수\n'+ranking.map((p,i)=>[i+1,p.name,p.facility,p.score].map(esc).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};setInterval(poll,700);poll();</script></html>
